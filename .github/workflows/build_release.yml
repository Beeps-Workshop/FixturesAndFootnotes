name: Release build

# Fixtures & Footnotes' release orchestrator. Unlike the other workshop projects this does NOT call
# Beeps-Workshop/.github's reusable build.yml + release.yml, because it's the first multi-loader mod
# here and those are built around a single jar: build.yml `mv`s one glob to one filename, and
# release.yml publishes one file. Fold this back into the shared pair when a second multi-loader mod
# turns up — until then, duplicating ~60 lines beats bending shared CI around one caller.
#
# Three things the shared workflow would get wrong here, for whoever does that generalising:
#   1. The version property is `mod.version` (dotted), read via findProperty. `-Pmod_version=` — what
#      the shared build.yml passes — is accepted silently and changes nothing, so the run goes green
#      and ships jars still stamped with the old version. Worst kind of failure; hence the assert.
#   2. A bare `gradlew build` also builds the 1.21.4 Stonecutter node, which doesn't compile yet.
#      Only the per-version tasks are safe.
#   3. Each libs/ also holds -sources and -dev-shadow jars that must never be uploaded.
#
# .github/workflows/build_release.yml
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

env:
  MC: '1.21.1'

# Publishing is driven by two repository variables, MODRINTH_ID and CURSEFORGE_ID (Settings ->
# Secrets and variables -> Actions -> Variables). Neither project exists yet, so while they're
# unset the publish job is skipped and the GitHub Release half still works from the first tag.
# Tokens come from the org secrets the other projects already use.

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          RAW="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build both loaders
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          chmod +x ./gradlew
          ./gradlew ":fabric:${MC}:build" ":neoforge:${MC}:build" -Pmod.version="${VERSION}"

      - name: Collect jars
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p out
          for LOADER in fabric neoforge; do
            # Exact name, not a glob: the same directory holds -sources and -dev-shadow jars.
            JAR="${LOADER}/versions/${MC}/build/libs/fixfoot-${LOADER}-${VERSION}+${MC}.jar"
            test -f "$JAR" || { echo "::error::missing $JAR — did -Pmod.version take effect?"; exit 1; }
            cp "$JAR" "out/fixfoot-${LOADER}-${VERSION}+${MC}.jar"
          done
          ls -l out

      - name: Assert the jars are stamped with the release version
        # -Pmod.version silently no-ops if the property name ever drifts, which would publish jars
        # named for the new version but built as the old one. Check the metadata, not the filename.
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Metadata carries the bare mod.version; only the filename gets the +<mc> suffix.
          unzip -p "out/fixfoot-fabric-${VERSION}+${MC}.jar" fabric.mod.json > /tmp/fabric.mod.json
          FOUND=$(jq -r '.version' /tmp/fabric.mod.json)
          echo "fabric.mod.json version: ${FOUND}"
          if [ "$FOUND" != "${VERSION}" ]; then
            echo "::error::jar reports '${FOUND}', expected '${VERSION}'"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fixfoot-${{ needs.prepare.outputs.version }}
          path: out/*.jar
          retention-days: 180

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach both jars to the GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fixfoot-${{ needs.prepare.outputs.version }}
          path: out

      - name: Attach to GitHub Release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [prepare, build]
    if: ${{ vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != '' }}
    runs-on: ubuntu-latest
    strategy:
      # One platform version per loader rather than one version carrying both jars, so nobody
      # downloads the wrong file. Modrinth requires unique version numbers, hence the suffix.
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fixfoot-${{ needs.prepare.outputs.version }}
          path: out

      - uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          version: ${{ needs.prepare.outputs.version }}+${{ matrix.loader }}
          version-type: release
          loaders: ${{ matrix.loader }}
          # The 1.21.1 branch targets both, per mod.mc_targets in versions/1.21.1/gradle.properties.
          game-versions: |
            1.21
            1.21.1
          files: out/fixfoot-${{ matrix.loader }}-${{ needs.prepare.outputs.version }}+${{ env.MC }}.jar
          # Architectury is a required runtime dependency, not shaded in — without this declared,
          # every user installs the mod and it refuses to start. Declaring it lets launchers pull it
          # in automatically. Resolved by slug; pin as architectury-api(required){modrinth:ID} if a
          # platform ever fails to resolve it.
          dependencies: |
            architectury-api(required)
          changelog: ${{ github.event.release.body || format('Release {0}', needs.prepare.outputs.version) }}
